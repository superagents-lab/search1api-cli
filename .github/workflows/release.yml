name: Release

# Run this workflow on master (workflow_dispatch) to release the version in
# package.json: it creates the v<version> tag and GitHub Release with the
# binaries, then publishes to npm. Pushing a v<version> tag still works too.
# Steps skip what is already published, so a re-run only fills in the rest.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Release only from master
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/master
      - name: Verify release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e "const { version } = require('./package.json');
          if (process.env.RELEASE_TAG !== 'v' + version)
          throw new Error('Release tag must be v' + version);"
      - run: npm test
      - run: npm pack --dry-run

  build-and-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binaries for all platforms
        run: bun run scripts/build-binary.ts --cross

      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-bin/* --clobber
          else
            gh release create "$TAG" \
              dist-bin/* \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

  publish-npm:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/search1api-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Publish package
        run: |
          PACKAGE_SPEC=$(node -p "const packageJson = require('./package.json'); packageJson.name + '@' + packageJson.version")
          if npm view "$PACKAGE_SPEC" version >/dev/null 2>&1; then
            echo "$PACKAGE_SPEC is already published"
          else
            npm publish
          fi
